<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Universe pilot · synthetic preview</title>
<style>body{margin:0;background:#05101f;color:#eaf2ff;font:14px/1.5 Inter,system-ui,sans-serif}*{box-sizing:border-box}
.pv-bar{position:fixed;z-index:2147483000;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:#2b1f05;border:2px solid #f2b84b;color:#fde8be;font-size:12.5px;max-width:calc(100vw - 24px)}
.pv-bar summary{cursor:pointer;font-weight:700;color:#f2b84b;list-style:none}.pv-bar[open]{max-width:min(560px,calc(100vw - 16px))}.pv-bar[open] summary{flex-basis:100%}.pv-bar strong{color:#f2b84b}.pv-bar label{display:inline-flex;gap:4px;align-items:center}.pv-bar select,.pv-bar button{font:inherit;min-height:34px;border-radius:8px;border:1px solid #f2b84b;background:#1b1406;color:#fde8be;padding:2px 8px;cursor:pointer}
.pv-coach{max-width:1100px;margin:0 auto;padding:24px 0 120px}.pv-home{max-width:720px;margin:auto;padding:32px 16px 120px;display:grid;gap:12px}
.pv-home button{font:inherit;font-weight:700;justify-self:start;min-height:46px;padding:10px 18px;border:0;border-radius:11px;background:#96d700;color:#10200a;cursor:pointer}.pv-cards{display:grid;gap:12px}.pv-home .pv-card{display:grid;gap:6px;width:100%;justify-self:stretch;padding:18px;text-align:left;border:1px solid #38536f;border-radius:14px;background:#102540;color:#eaf2ff;font-weight:400}.pv-card strong{font-size:18px}.pv-card small{color:#b0c2d6}.pv-home h2{margin:12px 0 0;font-size:18px}</style></head>
<body><div id="root"></div><script type="module" src="./pilot.jsx"></script></body></html>
