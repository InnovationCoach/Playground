<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Universe · local service demo (emulator only)</title>
<style>body{margin:0;background:#05101f;color:#eaf2ff;font:14px/1.5 Inter,system-ui,sans-serif}*{box-sizing:border-box}
.sv-bar{position:fixed;z-index:2147483000;right:8px;bottom:8px;width:min(440px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;padding:8px 12px;border-radius:12px;background:#2b1f05;border:2px solid #f2b84b;color:#fde8be;font-size:12.5px}
.sv-bar summary{cursor:pointer;font-weight:700;color:#f2b84b}.sv-bar h3{margin:10px 0 4px;font-size:12.5px;color:#f2b84b;text-transform:uppercase;letter-spacing:.06em}.sv-bar p{margin:4px 0}
.sv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sv-bar select,.sv-bar button{font:inherit;min-height:34px;border-radius:8px;border:1px solid #f2b84b;background:#1b1406;color:#fde8be;padding:2px 8px;cursor:pointer}.sv-bar button:disabled{opacity:.5;cursor:default}
.sv-bar code,.sv-bar pre{font:12px/1.4 ui-monospace,Menlo,monospace;color:#fff3d6}.sv-bar pre{white-space:pre-wrap;word-break:break-word;margin:4px 0;padding:6px;border-radius:8px;background:#1b1406;max-height:220px;overflow:auto}
.sv-coach{max-width:1100px;margin:0 auto;padding:24px 0 160px}.sv-home{max-width:720px;margin:auto;padding:32px 16px 160px;display:grid;gap:12px}.sv-refuse{max-width:640px;margin:15vh auto;padding:24px;border:2px solid #f2b84b;border-radius:12px}</style></head>
<body><div id="root"></div><script type="module" src="./service.jsx"></script></body></html>
