<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Universe · local service demo (emulator only)</title>
<style>body{margin:0;background:#05101f;color:#eaf2ff;font:14px/1.5 Inter,system-ui,sans-serif}*{box-sizing:border-box}
.sv-bar{width:min(720px,calc(100% - 32px));margin:8px auto 24px;padding:8px 12px;border-radius:12px;background:#181b20;border:1px solid #89703d;color:#fde8be;font-size:12.5px;overflow-wrap:anywhere}
.sv-bar summary{cursor:pointer;font-weight:600;color:#e9c98a;min-height:32px;align-content:center}.sv-bar h3{margin:10px 0 4px;font-size:12.5px;color:#f2b84b;text-transform:uppercase;letter-spacing:.06em}.sv-bar p{margin:4px 0}
.sv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sv-bar select,.sv-bar button{font:inherit;min-height:34px;max-width:100%;border-radius:8px;border:1px solid #f2b84b;background:#1b1406;color:#fde8be;padding:2px 8px;cursor:pointer}.sv-bar button{white-space:normal;text-align:left}.sv-bar button:disabled{opacity:.5;cursor:default}
.sv-bar code,.sv-bar pre{font:12px/1.4 ui-monospace,Menlo,monospace;color:#fff3d6}.sv-bar pre{white-space:pre-wrap;word-break:break-word;margin:4px 0;padding:6px;border-radius:8px;background:#1b1406;max-height:220px;overflow:auto}
.sv-coach{max-width:1100px;margin:0 auto;padding:24px 16px}.sv-home{max-width:752px;margin:auto;padding:32px 16px 16px;display:grid;gap:12px}.sv-home h1{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.25}.sv-home p{margin:0}.sv-eyebrow{color:#9bd2ff;font-weight:600}.sv-missions{display:grid;gap:12px;margin:8px 0}.sv-mission{display:grid;gap:6px;width:100%;padding:18px;text-align:left;border:1px solid #38536f;border-radius:14px;background:#102540;color:#eaf2ff;font:inherit;cursor:pointer}.sv-mission strong{font-size:18px}.sv-mission small,.sv-preview-note{color:#b0c2d6}.sv-mission:hover{border-color:#96d700;background:#162f4e}.sv-mission:disabled{opacity:.6;cursor:wait}.sv-mission:focus-visible,.sv-bar summary:focus-visible,.sv-back:focus-visible{outline:3px solid #96d700;outline-offset:3px}.sv-back{font:inherit;min-height:42px;margin-bottom:16px;border:1px solid #38536f;border-radius:8px;background:#102540;color:#eaf2ff;padding:8px 16px;cursor:pointer}.sv-refuse{max-width:640px;margin:15vh auto;padding:24px;border:2px solid #f2b84b;border-radius:12px}</style></head>
<body><div id="root"></div><script type="module" src="./service.jsx"></script></body></html>
